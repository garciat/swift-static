name: Pages

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4"
          skip-verify-signature: true

      - name: Install JavaScriptCore
        run: |
          sudo apt-get update
          sudo apt-get install -y libjavascriptcoregtk-4.1-dev

      - uses: actions/checkout@v6

      - name: Build project
        run: swift build

      - name: Setup Pages
        id: setup-pages
        uses: actions/configure-pages@v6

      - name: Build site
        env:
          BASE_URL: ${{ steps.setup-pages.outputs.base_url }}
        run: BASE_URL="$BASE_URL" swift run demo-site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
